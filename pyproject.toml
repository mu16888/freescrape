[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freescrape"
version = "0.1.0"
description = "A free, open-source web scraping CLI — scrape, search, and extract web data from your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "FreeScrape contributors" }]
keywords = ["scraping", "web-scraping", "cli", "data-extraction", "search", "playwright", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "trafilatura>=1.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rich>=13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
llm = ["openai>=1.0"]

[project.urls]
Homepage = "https://github.com/your-org/freescrape"
Repository = "https://github.com/your-org/freescrape"

[project.scripts]
freescrape = "freescrape.cli:cli"
fs = "freescrape.cli:cli"

[tool.setuptools.packages.find]
include = ["freescrape*"]
